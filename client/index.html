<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedulite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="top-bar">
        <h1 id="main-title">Schedulite</h1>
        <button type="button" id="google-calendar-btn">Connect Google Calendar</button>
    </header>

    <div id="mobile-modal-backdrop"></div>

    <div id="create-task-div" class="custom-fieldset">
        <span class="custom-legend">New Task</span>
        <button type="button" id="close-create-task-btn" aria-label="Close new task menu">&times;</button>
        <div id="inputs-holder">
            <div class="input-label-holder">
                <label for="task-title-inp" class="input-label">Title</label>
                <input type="text" id="task-title-inp" class="task-input-text">
            </div>
            <div class="input-label-holder">
                <label for="task-description-inp" class="input-label">Description</label>
                <input type="text" id="task-description-inp" class="task-input-text">
            </div>
            <div class="input-label-holder">
                <label for="task-priority-inp" class="input-label">Priority</label>
                <select name="Priority" id="task-priority-inp" class="task-input-text">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div class="input-label-holder">
                <label for="task-deadline-inp" class="input-label">Deadline</label>
                <input type="date" id="task-deadline-inp" class="task-input-text">
            </div>
            <div class="input-label-holder">
                <label for="task-duration-inp" class="input-label">Duration (hrs)</label>
                <input type="text" id="task-duration-inp" class="task-input-text">
            </div>
        </div>

        <button id="create-task-btn">Schedule</button>

    </div>

    <div id="task-holder-div" class="custom-fieldset">
        <span class="custom-legend">Scheduled Tasks</span>
    </div>

    <button type="button" id="open-create-task-btn" aria-label="Create new task">+ New Task</button>

    <script src="script.js"></script>
</body>
</html>
